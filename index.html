:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
body { font-family: "Vazirmatn", sans-serif; color:#f4f4f4; }
.scene { position:fixed; inset:0; display:grid; place-items:center; opacity:0; visibility:hidden; transition:opacity .65s ease; }
.scene.active { opacity:1; visibility:visible; }
#warning { background:
 radial-gradient(ellipse at center, rgba(90,0,0,.18), transparent 55%),
 #030303; }
.warning-box { width:min(900px,92vw); text-align:center; padding:40px 22px; border:1px solid rgba(255,35,35,.32); position:relative; box-shadow:0 0 70px rgba(255,0,0,.08), inset 0 0 45px rgba(255,0,0,.035); }
.warning-box:before,.warning-box:after { content:""; position:absolute; width:58px; height:3px; background:#e11; top:-1px; left:-1px; box-shadow:0 0 16px #f00; }
.warning-box:after { top:auto; left:auto; bottom:-1px; right:-1px; }
.warning-mark { color:#f11; font:700 clamp(40px,8vw,76px)/1 monospace; text-shadow:0 0 24px #f00; margin-bottom:24px; }
.warning-title { direction:ltr; font:800 clamp(28px,6vw,66px)/1.12 Arial,sans-serif; letter-spacing:.045em; color:#f22; text-shadow:0 0 24px rgba(255,0,0,.45); }
.warning-sub { margin-top:25px; color:#b7b7b7; font:500 13px/1.8 monospace; letter-spacing:.16em; direction:ltr; }
.warning-note { margin-top:28px; color:#777; font-size:12px; }
#burn { background:#000; }
#burn img { width:100%; height:100%; object-fit:cover; display:block; }
#burn:after { content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.22) 4px 5px); mix-blend-mode:multiply; }
.burn-flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
#burn.active { animation: shake .12s steps(2,end) infinite; }
@keyframes shake { 0%{transform:translate(0,0)} 25%{transform:translate(2px,-1px)} 50%{transform:translate(-2px,1px)} 75%{transform:translate(1px,2px)} 100%{transform:translate(0,0)} }

  }
